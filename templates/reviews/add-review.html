{% extends 'base.html' %}
{% load static %}

{% block content %}
    <form method="post" class="container">
        <div class="form-style mx-auto d-flex flex-column form-group align-items-center justify-center add-post">
            <h2>Create Review for <span class="carattere-cursive">"{{ book.title }}"</span></h2>

            {% csrf_token %}

             {% if form.errors %}
              <div class="alert alert-danger">
                {{ form.errors }}
              </div>
            {% endif %}

            <div class="mb-3">
                {{ form.rating.label_tag }}
                {{ form.rating }}
            </div>

            <div class="mb-3">
                {{ form.content.label_tag }}
                {{ form.content }}
            </div>

            <button type="submit">Submit</button>
        </div>

    </form>



{% endblock %}
