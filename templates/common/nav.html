{% load static %}


<nav class="d-flex justify-content-between">
    {% if request.user.is_authenticated %}
        <a href="{% url 'posts-feed' %}" class="menu-link">
            <img src="{% static 'images/logo.png' %}" class="nav-logo" alt="logo"/>
        </a>
    {% else %}
        <a href="{% url 'home' %}" class="menu-link">
            <img src="{% static 'images/logo.png' %}" class="nav-logo" alt="logo"/>
        </a>
    {% endif %}
    <div class="search-bar mt-3 times-new-roman">
        <input type="text" id="search-input" placeholder="SEARCH... "/>
        <ul id="search-results" class="search-results times-new-roman"></ul>
    </div>


    <ul class="menu center-flex gap-3">
        {% if request.user.is_authenticated %}
            <li class="tooltip-container">
                <a href="{%  url 'add-post' %}">
                    <i class="fa-solid fa-circle-plus"></i>
                    <span class="tooltip-text">Add post</span>
                </a>
            </li>

            <li class="tooltip-container">
                <a href="{% url 'add-review' %}">
                    <i class="fa-solid fa-pencil"></i>
                    <span class="tooltip-text">Add book review</span>
                </a>
            </li>
            <li class="tooltip-container">
                <a href="{% url 'posts-feed' %}">
                    <i class="fa-solid fa-grip-vertical"></i>
                    <span class="tooltip-text">Post feed</span>
                </a>
            </li>

            <li class="tooltip-container">
                <a href="{% url 'genres-list' %}">
                    <i class="fa-solid fa-book-open-reader"></i>
                    <span class="tooltip-text">Books</span>
                </a>
            </li>
            <li class="tooltip-container">
                <a href="{% url 'profile-details-page' request.user.pk %}">
                    <i class="fa-solid fa-user"></i>
                    <span class="tooltip-text">My Profile</span>
                </a>
            </li>
            <li class="tooltip-container">
                <a href="{% url 'logout' %}" onclick="event.preventDefault(); document.getElementById('logout-form').submit()">
                     <i class="fa-solid fa-person-hiking"></i>
                    <span class="tooltip-text">Log out</span>
                </a>
            </li>
        {% else %}
            <li class="tooltip-container">
                <a href="{% url 'login' %}">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="tooltip-text">Log in</span>
                </a>
            </li>
        {% endif %}
    </ul>
</nav>

<form style="display: none" id="logout-form" action="{% url 'logout' %}" method="post">
    {% csrf_token %}
</form>


<script>
document.addEventListener('DOMContentLoaded', function () {
    const input = document.getElementById('search-input');
    const resultsBox = document.getElementById('search-results');

    input.addEventListener('input', function () {
        const query = this.value.trim();

        if (query.length < 2) {
            resultsBox.innerHTML = '';
            resultsBox.style.display = 'none';
            return;
        }

        fetch(`/api/search/?q=${encodeURIComponent(query)}`)
            .then(response => response.json())
            .then(data => {
                resultsBox.innerHTML = '';

                 if (data.length === 0) {

                    resultsBox.style.display = 'none';

                    return;

                }

                resultsBox.style.display = 'block';

                data.forEach(item => {
                    const link = document.createElement('a');
                    link.href = item.url;
                    link.textContent = item.label || item.title || item.first_name || item.username || 'Result';
                    link.style.display = 'block';
                    resultsBox.appendChild(link);
                });
            })
            .catch(error => {
                console.error('Search error:', error);
                resultsBox.style.display = 'none';
            });
    });
});
</script>
