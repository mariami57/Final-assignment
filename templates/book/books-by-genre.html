{% extends 'base.html' %}
{% load static %}

{% block content %}
     <h1 class="title mx-auto carattere-cursive"> Books in genre</h1>
     <h1 class="title mx-auto carattere-cursive mb-3">{{ genre }}</h1>
     <div class="row g-4">
       {% for book in object_list %}
         <div class="col-md-4 col-sm-6 col-10">
           <div class="book text-center p-3 border rounded">
             <a href="{% url 'reviews-list' book_pk=book.pk %}">
               <div class="d-flex justify-content-center gap-3">
                 <i class="fa-solid fa-book-bookmark"></i>
                 <div>
                   <p>"{{ book.title }}"</p>
                   <p>by</p>
                   <p>{{ book.author }}</p>
                 </div>
               </div>
             </a>
           </div>
         </div>
       {% endfor %}
     </div>

{% endblock %}
